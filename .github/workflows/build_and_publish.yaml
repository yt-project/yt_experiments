# based off the cookiecutter action provided by https://github.com/scientific-python/cookie
name: wheels

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build_and_publish.yaml
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Many color libraries just need this to be set to any value, but at least
  # one distinguishes color depth, where "3" -> "256-bit color".
  FORCE_COLOR: 3

jobs:
  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build SDist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [
          ubuntu-latest,
          windows-latest,
          macos-15-intel, # x86_64
          macos-latest, # arm64
        ]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl

  build_pyodide:
    name: Wheel (pyodide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build pyodide wheels
        uses: pypa/cibuildwheel@v4.2
        env:
          # Tell cibuildwheel to build for pyodide (WASM)
          CIBW_PLATFORM: pyodide
          # Optional: build all pyodide wheel tags
          CIBW_BUILD: '*'
          # Ensure output lands in wheelhouse
          CIBW_OUTPUT_DIR: wheelhouse

      - name: Upload pyodide wheels
        uses: actions/upload-artifact@v7
        with:
          # Note: we prepend "no-pypi-" to avoid this artifact being
          # included in the PyPI upload step.
          name: no-pypi-cibw-wheels-pyodide
          path: wheelhouse/*.whl

  upload_all:
    needs: [build_wheels, make_sdist]
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: "dist/*"

      - uses: pypa/gh-action-pypi-publish@release/v1

  create_gh_draft_release:
    needs: [upload_all, build_pyodide]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "*cibw*"
      - name: Display structure of downloaded files
        run: ls -R
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "Release $TAG" \
            --notes "# $TAG" \
            --generate-notes \
            *cibw*/*.whl cibw-sdist/*.tar.gz
